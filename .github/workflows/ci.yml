# Cổng tự động duy nhất của repo.
#
# Trước đây không có gì chạy `eslint`, `tsc` hay `vitest` ngoài máy người viết:
# `vercel.json` chỉ chạy `check-migrations` rồi `next build`, nên một test đỏ vẫn
# lên production được.
#
# CỐ Ý không có `prisma migrate deploy` ở đây. Migration là một bước riêng chạy
# trước khi push, không phải một tác dụng phụ của việc build hay của CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Cùng chuỗi giả mà tests/setup-env.ts dùng, vì cùng một lý do: `schema.prisma`
    # tham chiếu `env("DATABASE_URL")` và `lib/prisma.ts` ném lỗi khi thiếu, còn
    # runner thì không có `.env.local`. Cổng 1 và tên database nói rõ nó không
    # nối đi đâu cả — lint, typecheck và unit test đều không chạm tới database.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/hdi_ci_never_connected
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `postinstall` chạy `prisma generate`; không có nó thì `tsc` không thấy
      # các kiểu sinh ra từ schema.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
